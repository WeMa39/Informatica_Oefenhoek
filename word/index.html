<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0">
<title>Word stap voor stap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=Stardos+Stencil:wght@700&display=swap">
<style>
/* Layout: spelkader met missiekaart boven, daaronder een nagebouwd Word-venster dat altijd licht blijft (zoals echt Word). */
:root{
  --bg:#EEF2F8; --panel:#FFFFFF; --ink:#16233A; --muted:#55627A; --line:#D3DAE6;
  --word:#2B579A; --word-deep:#1E3F73; --gold:#F2B705; --gold-ink:#5A4300;
  --on-word:#FFFFFF; --good:#1E7B45; --good-bg:#DDF3E5; --bad:#B3261E; --bad-bg:#FBE3E1; --hint-bg:#FFF4CC;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --ui:"Segoe UI", "Selawik", system-ui, -apple-system, sans-serif;
  /* Word-venster: bewust altijd licht */
  --w-bg:#F3F3F3; --w-rib:#FAFAFA; --w-ink:#262626; --w-line:#D6D6D6; --w-hover:#E1E9F5; --w-on:#C5D6EE; --w-canvas:#E6E6E6;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1726; --panel:#18233A; --ink:#E8EEF8; --muted:#A3B0C6; --line:#2C3B57;
  --word:#7EA6E8; --word-deep:#A9C4F0; --gold:#F5C83A; --gold-ink:#F5C83A;
  --on-word:#0F1726; --good:#6FD39A; --good-bg:#173A2A; --bad:#FF8A80; --bad-bg:#3D1C1C; --hint-bg:#3A3215; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1726; --panel:#18233A; --ink:#E8EEF8; --muted:#A3B0C6; --line:#2C3B57;
  --word:#7EA6E8; --word-deep:#A9C4F0; --gold:#F5C83A; --gold-ink:#F5C83A;
  --on-word:#0F1726; --good:#6FD39A; --good-bg:#173A2A; --bad:#FF8A80; --bad-bg:#3D1C1C; --hint-bg:#3A3215; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:1.7rem;font-weight:800;letter-spacing:-.01em}
.brand a.back{text-decoration:none;color:var(--word)}
.brand a.back:hover{text-decoration:underline}
.brand .tag{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem;display:flex;gap:6px;align-items:center}
.chip b{font-variant-numeric:tabular-nums}
.chip.pts b{color:var(--gold-ink)}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--word);color:var(--on-word)}
a.btn{display:inline-block;text-decoration:none}
.btn.ghost{background:transparent;color:var(--word);border:2px solid var(--word)}
.btn.small{padding:6px 12px;font-size:.9rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.muted{color:var(--muted)}
input.txt{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.95rem}

/* start */
.start{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media (max-width:760px){.start{grid-template-columns:1fr}}
.start h2{font-size:2.2rem;font-weight:800}
.start form{display:flex;flex-direction:column;gap:12px}
.err{color:var(--bad);font-weight:700;min-height:1.2em}
.rules{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--word);color:var(--panel);display:grid;place-items:center;font-weight:800;font-size:.85rem}

/* map */
.task{background:var(--panel);border:2px solid var(--word);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.task.locked{border-color:var(--line);opacity:.6}
.task .num{font-family:var(--display);font-weight:800;color:var(--word);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.task .d{color:var(--muted)}
.tsteps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.tsteps a.btn{margin:2px 4px 2px 0}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.lvl{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;color:var(--ink);min-height:132px}
.lvl:hover:not([disabled]){border-color:var(--word)}
.lvl[disabled]{opacity:.5;cursor:not-allowed}
.lvl .num{font-family:var(--display);font-weight:800;color:var(--word);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.lvl h3{font-size:1.15rem}
.lvl .d{font-size:.88rem;color:var(--muted);flex:1}
.stars{color:var(--gold);letter-spacing:2px;font-size:1.1rem}
.stars .off{color:var(--line)}
.codebox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.code{font-family:ui-monospace,Consolas,monospace;font-size:1.6rem;font-weight:700;letter-spacing:.08em;background:var(--hint-bg);color:var(--ink);padding:6px 14px;border-radius:10px;border:2px dashed var(--gold)}

/* hoofdstukken */
.chapter{display:flex;flex-direction:column;gap:10px}
.chhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:6px}
.chnum{font-family:var(--display);font-weight:800;color:var(--word);text-transform:uppercase;letter-spacing:.06em;font-size:.85rem}
.chhead h2{font-size:1.4rem;font-weight:800}
.chprog{font-size:.88rem;margin-left:auto}
.soonbox{border:2px dashed var(--line);border-radius:14px;padding:16px;color:var(--muted);font-weight:700}
.openbox{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.openbox .f{flex:1;min-width:220px}.openbox .err{flex-basis:100%;margin:0}

/* play */
.mission{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:start}
.mission .say{font-size:1.25rem;font-weight:700;line-height:1.35}
.say .k{color:var(--word);background:color-mix(in srgb,var(--word) 12%,transparent);padding:0 6px;border-radius:6px;white-space:nowrap}
.say .v{background:var(--hint-bg);padding:0 6px;border-radius:6px;white-space:nowrap}
.stepline{display:flex;gap:10px;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.fb{margin-top:10px;padding:8px 12px;border-radius:10px;font-size:.98rem;display:none}
.fb.show{display:block}
.fb.good{background:var(--good-bg);color:var(--good);font-weight:700}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.hint{background:var(--hint-bg);color:var(--ink)}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pop{font-family:var(--display);font-weight:800;color:var(--gold-ink);font-size:1.4rem;min-height:1.6rem}
.pop.anim{animation:pop .7s ease-out}
@keyframes pop{0%{transform:translateY(8px) scale(.8);opacity:0}40%{transform:translateY(0) scale(1.15);opacity:1}100%{transform:none}}

/* ---------- Word-venster ---------- */
.word{position:relative;border-radius:10px;overflow:hidden;border:1px solid #B9B9B9;background:var(--w-bg);color:var(--w-ink);font-family:var(--ui);font-size:12px;box-shadow:0 6px 24px rgba(16,30,60,.15)}
.wtitle{background:var(--word-fixed,#2B579A);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:12px}
.wtitle .doc{opacity:.95}
.wtabs{display:flex;gap:2px;background:#2B579A;padding:0 8px;overflow-x:auto}
.wtab{background:transparent;border:0;color:#fff;padding:6px 12px;font-size:12.5px;border-radius:4px 4px 0 0;white-space:nowrap;font-family:var(--ui)}
.wtab:hover{background:rgba(255,255,255,.15)}
.wtab.on{background:var(--w-rib);color:#2B579A;font-weight:600}
.wtab.file{background:#1E3F73}
.ribbonwrap{background:var(--w-rib);border-bottom:1px solid var(--w-line);overflow-x:auto}
.ribbon{display:flex;align-items:stretch;min-height:104px;padding:4px 6px;width:max-content}
.grp{display:flex;flex-direction:column;border-right:1px solid var(--w-line);padding:2px 8px;position:relative}
.grp .gb{display:flex;gap:2px;align-items:flex-start;flex:1}
.grp .gname{font-size:11px;color:#666;text-align:center;padding-top:2px;display:flex;justify-content:center;align-items:center;gap:6px}
.launch{border:0;background:transparent;width:16px;height:14px;padding:0;color:#555;display:inline-grid;place-items:center;border-radius:2px;position:absolute;right:2px;bottom:2px}
.launch:hover{background:var(--w-hover)}
.col{display:flex;flex-direction:column;gap:3px}
.row{display:flex;gap:2px;align-items:center}
.rb{border:1px solid transparent;background:transparent;border-radius:3px;color:var(--w-ink);font-family:var(--ui);font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:3px;min-width:26px;height:26px;padding:0 4px}
.rb:hover{background:var(--w-hover);border-color:#B9CDE8}
.rb.on{background:var(--w-on);border-color:#8FB0DC}
.rb.big{flex-direction:column;height:80px;min-width:48px;padding:4px 6px;font-size:11.5px;line-height:1.1;text-align:center}
.rb.big svg{width:30px;height:30px}
.rb.arrow{min-width:12px;padding:0 1px}
.rb svg{width:16px;height:16px}
.rb .gl{font-weight:700;font-size:14px;font-family:"Times New Roman",serif}
.split{display:inline-flex}
.split .rb:first-child{border-radius:3px 0 0 3px;padding-right:2px}
.split .rb:last-child{border-radius:0 3px 3px 0}
.combo{height:24px;border:1px solid #C6C6C6;background:#fff;color:var(--w-ink);font-family:var(--ui);font-size:12px;padding:0 4px;border-radius:2px}
.combo.font{width:130px}.combo.size{width:46px}
.stylegal{display:flex;gap:2px}
.stylegal .rb{flex-direction:column;width:68px;height:62px;border:1px solid #E1E1E1;background:#fff;gap:2px}
.stylegal .rb .sm{font-size:10px;color:#555}
.stylegal .rb.on{background:var(--w-on);border:2px solid #2B579A}
.menu{position:absolute;z-index:20;background:#fff;border:1px solid #BDBDBD;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:4px;min-width:170px;color:var(--w-ink);font-family:var(--ui)}
.menu .mi{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;gap:10px;align-items:center;font-size:12px;color:var(--w-ink);border-radius:2px}
.menu .mi:hover{background:var(--w-hover)}
.menu .mi small{color:#666;display:block}
.menu .sep{height:1px;background:#E1E1E1;margin:4px 0}
.menu .mh{font-weight:700;font-size:11px;padding:4px 8px;color:#444;background:#F0F0F0}
.swatches{display:grid;grid-template-columns:repeat(10,18px);gap:2px 4px;padding:6px}
.sw{width:18px;height:18px;border:1px solid #C8C8C8;padding:0}
.sw:hover{outline:2px solid #F29436}
.effects{display:grid;grid-template-columns:repeat(3,44px);gap:6px;padding:8px}
.fx{width:44px;height:44px;border:1px solid #E1E1E1;background:#fff;font:700 28px/1 "Calibri","Segoe UI",sans-serif;padding:0}
.fx:hover{border-color:#F29436}

.wbody{display:flex;justify-content:center;background:var(--w-canvas);height:440px;overflow:auto;padding:18px 12px;position:relative}
.page{background:#fff;width:672px;flex:none;min-height:950px;box-shadow:0 1px 4px rgba(0,0,0,.25);position:relative;transition:padding .35s}
.page .area{outline:1px dashed #D0D0D0;min-height:300px}
.page.kwast,.page.kwast .p{cursor:copy}
.p{cursor:text;border-radius:2px;color:#000;transition:background .15s}
.p:hover{background:rgba(43,87,154,.06)}
.p.sel{background:#C9DAF2}
.mark{color:#5B7DB1;font-family:"Segoe UI",sans-serif;font-weight:400;font-style:normal;text-decoration:none}
.wstatus{background:#F0F0F0;border-top:1px solid var(--w-line);padding:3px 12px;display:flex;gap:18px;font-size:11px;color:#444;flex-wrap:wrap}
.wstatus .kw{color:#B35C00;font-weight:700}

/* dialog */
.dlgback{position:absolute;inset:0;background:rgba(0,0,0,.18);display:grid;place-items:start center;padding-top:20px;z-index:30}
.dlg{background:#fff;border:1px solid #9A9A9A;box-shadow:0 10px 30px rgba(0,0,0,.3);width:min(430px,94%);font-family:var(--ui);font-size:12px;color:var(--w-ink)}
.dlg .dt{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid #E1E1E1;font-size:13px}
.dlg .dtabs{display:flex;gap:2px;padding:6px 10px 0}
.dlg .dtabs span{padding:4px 10px;border:1px solid #CFCFCF;border-bottom:0;background:#F5F5F5}
.dlg .dtabs span.on{background:#fff;font-weight:600}
.dlg .dc{padding:10px 14px;border-top:1px solid #CFCFCF;display:flex;flex-direction:column;gap:10px}
.dlg fieldset{border:0;border-top:1px solid #E1E1E1;padding:6px 0 0;margin:0;display:grid;grid-template-columns:auto 90px auto 110px;gap:6px 10px;align-items:center}
.dlg legend{font-weight:700;padding-right:6px;color:#2B579A}
.dlg input,.dlg select{font-family:var(--ui);font-size:12px;height:24px;border:1px solid #ABABAB;padding:0 4px;width:100%;color:var(--w-ink);background:#fff}
.dlg .df{display:flex;justify-content:flex-end;gap:8px;padding:10px 14px;border-top:1px solid #E1E1E1}
.dlg .db{min-width:76px;height:26px;border:1px solid #ABABAB;background:#F0F0F0;font-family:var(--ui);font-size:12px;color:var(--w-ink)}
.dlg .db.primary{border-color:#2B579A}
.dlg .db:hover{background:var(--w-hover)}
.preview{border:1px solid #CFCFCF;height:54px;display:flex;align-items:center;justify-content:center;color:#888;font-size:11px}

/* hint highlight */
.target{animation:glow 1s ease-in-out infinite;position:relative;z-index:5}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px #F2B705, 0 0 0 7px rgba(242,183,5,.35)}50%{box-shadow:0 0 0 3px #F2B705, 0 0 0 12px rgba(242,183,5,0)}}
@media (prefers-reduced-motion:reduce){.target{animation:none;box-shadow:0 0 0 4px #F2B705}.pop.anim{animation:none}}

/* end */
.done{display:grid;gap:14px;justify-items:start}
.done .bigstars{font-size:3rem;color:var(--gold);letter-spacing:6px}
.done .bigstars .off{color:var(--line)}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.85rem}
.linkbtn{background:none;border:0;color:var(--word);text-decoration:underline;padding:0}
.teacher{display:grid;gap:10px;max-width:520px}
.result{padding:10px 12px;border-radius:10px;font-weight:700}

/* overzicht: hoofdstukken als tabbladen, per hoofdstuk eerst leren, dan toepassen */
.chtabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.chtab{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.chtab:hover{border-color:var(--word)}
.chtab[aria-selected="true"]{border-color:var(--word);box-shadow:inset 0 -5px 0 var(--word)}
.chtab b{font-family:var(--display);font-size:1.1rem;line-height:1.15}
.chtab .meta{font-size:.82rem;color:var(--muted)}
.chtab.off{opacity:.7}
.minibar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.minibar i{display:block;height:100%;background:var(--gold)}
.chapter.card{gap:22px}
.part{display:flex;flex-direction:column;gap:10px}
.parthead{display:flex;align-items:center;gap:10px;font-size:1.15rem}
.pn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--word);color:var(--on-word);display:grid;place-items:center;font-size:.9rem}
.parttxt{margin:-4px 0 0;font-size:.92rem}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.task h4{font-family:var(--display);font-size:1.15rem;margin:0;line-height:1.15}
.tfiles{display:flex;gap:8px;flex-wrap:wrap}
.tsave{font-size:.9rem;overflow-wrap:anywhere}
.task .btn{align-self:flex-start}
details.more summary{cursor:pointer;font-weight:700;color:var(--word)}
details.more[open] summary{margin-bottom:12px}

/* lijst met meerdere niveaus en inhoudsopgave */
.area{-webkit-user-select:none;user-select:none}
.mllib{display:grid;grid-template-columns:repeat(3,88px);gap:6px;padding:8px}
.mlt{width:88px;height:72px;font:400 10px/1.3 var(--ui);text-align:left;padding:5px;display:flex;flex-direction:column;gap:4px;overflow:hidden;color:#262626}
.mlt span{display:flex;align-items:center;gap:3px;white-space:nowrap}
.mlt i{flex:1;height:2px;background:#BDBDBD;min-width:8px}
.mlgrid{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.mllv{display:grid;grid-template-columns:repeat(3,30px);gap:3px}
.dlg .mllv .db{min-width:0;width:30px}
.dlg .db.on{background:var(--w-on);border-color:#2B579A;font-weight:700}
.mlprev{border:1px solid #CFCFCF;padding:8px;display:flex;flex-direction:column;gap:6px;font-size:11px;min-height:80px}
.mlprev div{display:flex;align-items:center}
.mlprev i{flex:1;height:4px;background:#D0D0D0}
.mlprev .cur{font-weight:700;color:#2B579A}.mlprev .cur i{background:#2B579A}
.dlg .mi{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;gap:8px;align-items:center;font-size:12px;color:var(--w-ink);border-radius:2px}
.dlg .mi:hover{background:var(--w-hover)}
.toc{border:1px solid #D9D9D9;padding:4px 8px;margin:0 0 6px;color:#000;font-family:Calibri, Carlito, 'Segoe UI', sans-serif}
.tocl{display:flex;gap:4px;align-items:baseline}
.tocl .dots{flex:1;border-bottom:1.5px dotted #000;margin:0 2px}
</style>

<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CM = 32, PT = CM/28.3465;

/* ---------- opslag (enkel gemak: de code is de echte bewaarplaats) ---------- */
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- code: level-punten-controle ---------- */
function hash(s){ let h=5381; for(const c of s) h=((h*33) ^ c.charCodeAt(0)) >>> 0; return h; }
function norm(n){ return n.toLowerCase().replace(/\s+/g," ").trim(); }
// eerste deel van de code: "5" = levels 1 t/m 5 (oude vorm), "X1FF" = bitmasker van de afgewerkte levels
function lvPart(levels){ const L=[...levels].sort((a,b)=>a-b); if(L.every((v,i)=>v===i+1)) return String(L.length);
  return "X"+L.reduce((m,v)=>m+2**(v-1),0).toString(36).toUpperCase(); }
function partLevels(p){ if(/^\d+$/.test(p)){ const n=+p; return Array.from({length:n},(_,i)=>i+1); }
  const m=parseInt(p.slice(1),36), out=[]; for(let i=1;i<=LEVELS.length;i++) if(Math.floor(m/2**(i-1))%2) out.push(i); return out; }
function makeCode(name, levels, score){
  const lvl = Array.isArray(levels)? lvPart(levels) : String(levels);
  const chk = (hash(norm(name)+"|"+lvl+"|"+score+"|lintkampioen") % 1679616).toString(36).toUpperCase().padStart(4,"0");

 { name:"Opsommingen en nummering", d:"Een recept met een opsomming en een genummerde lijst, zoals Oef 5.1 Tiramisu.", doc:"tiramisu", file:"Tiramisu", steps:[
   {info:"Een <b>opsomming</b> zet een teken voor elke regel, bv. een bolletje of een vierkantje. Dat gebruik je als de volgorde niet belangrijk is, zoals bij ingrediënten. Een <b>nummering</b> zet er 1, 2, 3 voor. Dat gebruik je als de volgorde wél belangrijk is, zoals bij de stappen van een recept."},

   {t:"Klik op het kleine pijltje naast [[Opsommingstekens]].", a:"menu:opsomming", h:"Rechts naast de knop met de bolletjes staat een klein pijltje ▾."},

/* ---------- toestand ---------- */
let S = { screen:"start", name:"", klas:"", prog:{best:{}, unlocked:1} };
let G = null; // spel in een level

function save(){ if(S.name) store.set("lk:"+norm(S.name), S.prog); store.set("lk:last", {name:S.name, klas:S.klas}); }
function total(){ return Object.values(S.prog.best).reduce((a,b)=>a+(b.score||0),0); }
function done(){ return Object.keys(S.prog.best).map(Number).filter(k=>S.prog.best[k] && k<=LEVELS.length); }
function maxPts(L){ return L.steps.filter(s=>!s.info).length*10; }
function starsFor(score, max){ const r=score/max; return r>=.9?3: r>=.7?2: 1; }
function starHTML(n, cls="stars"){ return `<span class="${cls}" aria-label="${n} van 3 sterren">${[1,2,3].map(i=>i<=n?"★":`<span class="off">★</span>`).join("")}</span>`; }

/* ---------- schermen ---------- */
const app = $("#app");
function header(){
  const pts = total();
  return `<div class="top"><div class="brand"><svg width="38" height="38" viewBox="0 0 38 38" aria-hidden="true"><rect x="2" y="4" width="34" height="30" rx="6" fill="#2B579A"/><path d="M9 13h4l2.5 10 3-10h3l3 10 2.5-10h4l-4.8 14h-3.4L19 17.5 16.3 27h-3.4z" fill="#fff"/></svg>
    <div><h1>Word stap voor stap</h1>${window.self===window.top?`<a class="tag back" href="../">← Oefenhoek Informatica</a>`:`<div class="tag">Oefenhoek Informatica</div>`}</div></div>
    ${S.name?`<div class="chips"><span class="chip">${esc(S.name)}${S.klas?" · "+esc(S.klas):""}</span><span class="chip pts">Punten <b>${pts}</b></span><span class="chip">Levels <b>${done().length}/${LEVELS.length}</b></span></div>`:""}</div>`;
}
function footer(){
  return `<div class="foot muted"><span>Oefenomgeving: lijkt op Word, maar is het niet. Probeer daarna alles ook in het echte Word.</span><button class="linkbtn" data-go="teacher">Voor de leerkracht: code controleren</button></div>`;
}
function render(){
  if(S.screen==="start") return renderStart();
  if(S.screen==="map") return renderMap();
  if(S.screen==="play") return renderPlay();
  if(S.screen==="end") return renderEnd();
  if(S.screen==="teacher") return renderTeacher();
}
function renderStart(){
  const last = store.get("lk:last")||{};
  app.innerHTML = header() + `<div class="start">
   <div class="card"><h2>Word leren, één klik per keer.</h2>
     <p class="muted">Je werkt in een nagebouwd Word. Elke opdracht is één klik of één ding typen. Doe je het juist, dan scoor je punten.</p>
     <ul class="rules">
       <li><span class="n">1</span><span>Lees de opdracht bovenaan en voer ze uit.</span></li>
       <li><span class="n">2</span><span>Juist van de eerste keer: <b>10 punten</b>. Een fout? Je krijgt een tip. Nog een fout? De knop begint te knipperen.</span></li>
       <li><span class="n">3</span><span>Na elk level krijg je een <b>code</b>. Lever die in op Teams. Met die code speel je de volgende les verder.</span></li>
     </ul></div>
   <div class="card"><form id="f-start" novalidate>
     <h3>Wie speelt er?</h3>
     <label class="f" for="in-name">Voornaam en achternaam<input class="txt" id="in-name" autocomplete="off" value="${esc(last.name||"")}"></label>
     <label class="f" for="in-klas">Klas<input class="txt" id="in-klas" autocomplete="off" value="${esc(last.klas||"")}" placeholder="bv. 3B"></label>
     <label class="f" for="in-code">Code van vorige keer of van je leerkracht (als je die hebt)<input class="txt" id="in-code" autocomplete="off" placeholder="bv. 3-240-K7QZ"></label>
     <div class="err" id="err"></div>
     <button class="btn" type="submit">Start</button>
   </form></div></div>` + footer();
  $("#f-start").addEventListener("submit", e=>{
    e.preventDefault();
    const name=$("#in-name").value.trim(), klas=$("#in-klas").value.trim(), code=$("#in-code").value.trim();
    if(name.split(/\s+/).length<2){ $("#err").textContent="Typ je voornaam én achternaam."; return; }
    S.name=name; S.klas=klas;
    S.prog = store.get("lk:"+norm(name)) || {best:{}, unlocked:1};
    const ci = code? chapterByCode(code) : -1;
    if(ci>=0){ openChapter(ci); save(); S.screen="map"; S.flash=`Hoofdstuk ${ci+1} (${CHAPTERS[ci].name}) staat nu open.`; return render(); }
    if(code){
      const r = readCode(name, code);
      if(!r){ $("#err").textContent="Deze code klopt niet bij deze naam. Kijk je naam en code na, of laat het vak leeg."; return; }
      for(const i of r.levels) if(!S.prog.best[i]) S.prog.best[i]={score:0, stars:0, fromCode:true};
      const known = Object.entries(S.prog.best).filter(([k,v])=>!v.fromCode).reduce((a,[k,v])=>a+v.score,0);
      const codeLv = Object.entries(S.prog.best).filter(([k,v])=>v.fromCode);
      if(codeLv.length){ const rest=Math.max(0,r.score-known); codeLv.forEach(([k,v],i)=>v.score = i===0?rest:0); }
      S.prog.unlocked = Math.max(S.prog.unlocked, Math.min(LEVELS.length, Math.max(...r.levels)+1));
    }
    save(); S.screen="map"; render();
  });
}
// code = de code die de leerkracht geeft om dit hoofdstuk meteen open te zetten
const CHAPTERS = [
  {name:"Teken- en alineaopmaak", levels:[1,2,3,4,5,6,7,8], code:"OPMAAK7"},
  {name:"Stijlen", levels:[10,11,12], code:"STIJL3",
   tasks:[{id:"1", name:"Oef 3.4 Festivals", after:12, d:"Nu in het echte Word: maak zelf de stijlen aan en pas de gouden regel toe op een tekst over festivals.",
     files:[["Opdrachtfiche (pdf)","festivals-fiche.pdf"],["Starttekst (Word)","festivals-opgave.docx"]]}]},
  {name:"Opsomming en nummering", levels:[9,13,14], code:"LIJST5"},
  {name:"Tabellen", levels:[], code:"TABEL4"}
];
function chapterByCode(c){ c=String(c).toUpperCase().replace(/[\s-]/g,""); return CHAPTERS.findIndex(ch=>ch.code===c); }
function openChapter(ci){ S.prog.open=[...new Set([...(S.prog.open||[]), ci])]; S.prog.ch=ci; }

function sendURL(n, v){ v = v || {naam:S.name, klas:S.klas, oefening:`${lvLabel(n)} ${G.L.name}`, score:`${G.score} / ${G.result.max}`, sterren:G.result.stars, fouten:G.errors};
  return SEND.url + Object.keys(v).filter(k=>SEND[k]).map(k=>"&"+SEND[k]+"="+encodeURIComponent(v[k])).join(""); }
function chapterOf(n){ return CHAPTERS.findIndex(c=>c.levels.includes(n)); }
function lvLabel(n){ const L=LEVELS[n-1]; if(L.boss) return "Eindopdracht"; const ci=chapterOf(n); return ci<0? "Level "+n : `Level ${ci+1}.${CHAPTERS[ci].levels.indexOf(n)+1}`; }
function isOpen(n){ const ci=chapterOf(n); if(ci<0) return false; const lv=CHAPTERS[ci].levels, i=lv.indexOf(n);
  if((S.prog.open||[]).includes(ci)) return true;
  if(i>0) return !!S.prog.best[lv[i-1]]; if(ci===0) return true; return !!S.prog.best[8]; }
function nextOf(n){ const order=CHAPTERS.flatMap(c=>c.levels); const i=order.indexOf(n); const nx = i>=0 && i<order.length-1? order[i+1] : null; return nx && isOpen(nx)? nx : null; }
function levelCard(n){
  const L=LEVELS[n-1], b=S.prog.best[n], open=isOpen(n);
  return `<button class="lvl" data-lvl="${n}" ${open?"":"disabled"}><span class="num">${lvLabel(n)}${open?"":" · op slot"}</span><h3>${esc(L.name)}</h3><span class="d">${esc(L.d)}</span>
      <span style="display:flex;justify-content:space-between;align-items:center">${starHTML(b?b.stars:0)}<span class="muted" style="font-size:.85rem">${b&&b.fromCode?"Gedaan (via code)":b&&b.score?b.score+" / "+maxPts(L)+" ptn":L.steps.filter(s=>!s.info).length+" stappen"}</span></span></button>`;
}
function taskCard(t, ci, ti){
  const open=!!S.prog.best[t.after] || (S.prog.open||[]).includes(ci), done=(S.prog.tasks||{})[t.id];
  if(!open) return `<div class="task locked"><span class="num">Opdracht in Word · op slot</span><h4>${esc(t.name)}</h4><span class="d">Gaat open als je ${lvLabel(t.after)} afgewerkt hebt.</span></div>`;
  return `<div class="task"><span class="num">Opdracht in Word${done?" · ingeleverd ✓":""}</span><h4>${esc(t.name)}</h4><span class="d">${esc(t.d)}</span>
    <div class="tfiles">${t.files.map(([l,f])=>`<a class="btn ghost small" href="${f}" download>${esc(l)}</a>`).join("")}</div>
    <span class="tsave">Bewaar als <b>${esc(((S.klas||"klas")+"_"+t.name.replace(/^Oef [\d.]+ /,"")+"_"+S.name.trim().replace(/\s+/g,"_")))}</b></span>
    <button class="btn small" data-task="${ci}:${ti}">${done?"Opnieuw melden":"Ik heb het ingeleverd"}</button></div>`;
}
function chapterInfo(c, ci){ const got=c.levels.filter(n=>S.prog.best[n]).length, tasks=c.tasks||[], tdone=tasks.filter(t=>(S.prog.tasks||{})[t.id]).length;
  return {got, tasks, tdone, open:(S.prog.open||[]).includes(ci) || c.levels.some(isOpen), full:c.levels.length>0 && got===c.levels.length}; }
function curCh(){ const c=S.prog.ch; if(Number.isInteger(c) && CHAPTERS[c]) return c;
  const i=CHAPTERS.findIndex(ch=>ch.levels.some(n=>isOpen(n) && !S.prog.best[n])); return i>=0? i : 0; }
function renderMap(){
  const code = done().length? makeCode(S.name, done(), total()) : "", ci=curCh(), c=CHAPTERS[ci], inf=chapterInfo(c, ci);
  app.innerHTML = header() + `<div class="card codebox" style="justify-content:space-between">
    <div><h2 style="font-size:1.5rem">Kies een hoofdstuk</h2><p class="muted" style="margin:4px 0 0">In elk hoofdstuk leer je eerst in de oefenomgeving. Daarna pas je het toe in het echte Word.</p></div>
    ${code?`<div><div class="muted" style="font-size:.85rem">Jouw code om verder te spelen</div><span class="code">${code}</span></div>`:""}</div>
    <div class="chtabs" role="tablist" aria-label="Hoofdstukken">${CHAPTERS.map((c2,i)=>{ const f=chapterInfo(c2,i), pct=c2.levels.length? f.got/c2.levels.length*100 : 0;
      return `<button class="chtab${f.open||!c2.levels.length?"":" off"}" role="tab" aria-selected="${i===ci}" data-ch="${i}"><span class="chnum">Hoofdstuk ${i+1}${f.full?" · klaar ✓":!f.open&&c2.levels.length?" · op slot":""}</span><b>${esc(c2.name)}</b>
        <span class="minibar" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="meta">${c2.levels.length? `${f.got} van ${c2.levels.length} levels`:"Binnenkort"}${f.tasks.length?` · ${f.tdone} van ${f.tasks.length} opdrachten`:""}</span></button>`; }).join("")}</div>
    <section class="card chapter" role="tabpanel" aria-label="Hoofdstuk ${ci+1}: ${esc(c.name)}">
      <div class="chhead"><span class="chnum">Hoofdstuk ${ci+1}</span><h2>${esc(c.name)}</h2>${c.levels.length?`<span class="muted chprog">${inf.got} van ${c.levels.length} levels gedaan</span>`:""}</div>
      ${c.levels.length? `<div class="part"><h3 class="parthead"><span class="pn">1</span>Leren in de oefenomgeving</h3><p class="muted parttxt">Speel de levels in volgorde. Je mag een level altijd opnieuw spelen om meer sterren te halen.</p><div class="levels">${c.levels.map(levelCard).join("")}</div></div>`
        : `<div class="soonbox">Binnenkort: hier komen nieuwe levels.</div>`}
      ${inf.tasks.length? `<div class="part"><h3 class="parthead"><span class="pn">2</span>Toepassen in het echte Word</h3><p class="muted parttxt">Download de opdrachtfiche en de starttekst. Open de starttekst in <b>Word</b>, volg de fiche, bewaar met de naam die erbij staat en lever in op <b>Teams</b>.</p><div class="tasks">${inf.tasks.map((t,ti)=>taskCard(t,ci,ti)).join("")}</div></div>` : ""}
    </section>
    <details class="card more"${S.flash?" open":""}><summary>Een hoofdstuk openen met een code van je leerkracht</summary>
      <form id="f-open" class="openbox" novalidate><label class="f" for="in-open">Code van je leerkracht<input class="txt" id="in-open" autocomplete="off" placeholder="bv. STIJL3"></label><button class="btn small" type="submit">Openen</button><div class="err" id="err-open"></div></form></details>
    <div><button class="btn ghost small" data-go="start">Andere speler</button></div>` + footer();
  if(S.flash){ $("#err-open").style.color="var(--good)"; $("#err-open").textContent=S.flash; S.flash=""; }
  $("#f-open").addEventListener("submit", e=>{ e.preventDefault(); const ci=chapterByCode($("#in-open").value);
    if(ci<0){ $("#err-open").style.color=""; $("#err-open").textContent="Die code ken ik niet. Vraag ze opnieuw aan je leerkracht."; return; }
    openChapter(ci); save(); S.flash=`Hoofdstuk ${ci+1} (${CHAPTERS[ci].name}) staat nu open.`; renderMap(); });
  app.querySelectorAll("[data-ch]").forEach(b=>b.addEventListener("click",()=>{ S.prog.ch=+b.dataset.ch; save(); renderMap(); }));
  app.querySelectorAll("[data-lvl]").forEach(b=>b.addEventListener("click",()=>startLevel(+b.dataset.lvl)));
  app.querySelectorAll("[data-task]").forEach(b=>b.addEventListener("click",()=>{ const [ci,ti]=b.dataset.task.split(":").map(Number), t=CHAPTERS[ci].tasks[ti];
    S.prog.tasks={...(S.prog.tasks||{}), [t.id]:true}; save();
    if(SEND.url) window.open(sendURL(0,{naam:S.name, klas:S.klas, oefening:`Opdracht in Word: ${t.name}`, score:"ingeleverd op Teams", sterren:"", fouten:""}),"_blank","noopener");
    renderMap(); }));
}

/* ---------- het spel ---------- */
function startLevel(n){
  const L = LEVELS[n-1];
  const doc = ({tiramisu:tiramisuDoc, films:filmsDoc, netflix:netflixDoc, avatar:avatarDoc, rasgroepen:rasgroepenDoc, vr:vrDoc}[L.doc] || freshDoc)();
  if(chapterOf(n)>=0){ S.prog.ch=chapterOf(n); save(); }
  if(L.preset==="kwast"){ Object.assign(doc.paras[2].s, SUB_STYLE); Object.assign(doc.paras[3].s, BODY_STYLE); doc.margins={boven:2,onder:2,links:2,rechts:2}; }
  if(n>=6 && !L.preset){ doc.margins={boven:2,onder:2,links:2,rechts:2}; }
  G = { n, L, i:0, miss:0, score:0, errors:0, doc, ui:{tab:"start", menu:null, dialog:null, dlg:{}, sel:null, marks:n>1, kwast:0, ctxPos:null}, msg:null, pop:"" };
  S.screen="play"; render(); window.scrollTo({top:0});
}
function step(){ return G.L.steps[G.i]; }
function fmt(t, boss){ return t.replace(/\[\[(.+?)\]\]/g, (m,x)=> boss?esc(x):`<span class="k">${esc(x)}</span>`).replace(/\{\{(.+?)\}\}/g,(m,x)=>`<span class="v">${esc(x)}</span>`); }

function renderPlay(){
  const st = step(), L=G.L;
  const real = L.steps.filter(s=>!s.info).length, doneSteps = L.steps.slice(0,G.i).filter(s=>!s.info).length;
  app.innerHTML = header() + `<div class="card mission">
    <div style="min-width:0"><div class="stepline"><b style="color:var(--word)">${lvLabel(G.n)}: ${esc(L.name)}</b><span>Stap ${Math.min(doneSteps+1,real)} van ${real}</span><span class="bar" aria-hidden="true"><i style="width:${doneSteps/real*100}%"></i></span></div>
      <div class="say" id="say">${st.info? st.info : st.quiz? fmt(st.quiz) : fmt(st.t, L.boss)}</div>
      ${st.quiz?`<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-quiz="lint" data-name="Lint">Via het lint</button><button class="btn" data-quiz="stijl" data-name="Stijl">Met een stijl</button></div>`:""}
      ${st.info?`<div style="margin-top:12px"><button class="btn" id="next">Verder</button></div>`:""}
      <div class="fb ${G.msg?"show "+G.msg.k:""}" id="fb" role="status">${G.msg?G.msg.h:""}</div></div>
    <div class="side"><span class="chip pts">Dit level <b>${G.score}</b></span><span class="pop" id="pop">${G.pop}</span><button class="btn ghost small" data-go="map">Stoppen</button></div></div>
    ${wordHTML()}` + footer();
  G.pop="";
  if(st.info) $("#next").addEventListener("click", ()=>{ G.msg=null; advance(); });
  app.querySelectorAll("[data-quiz]").forEach(b=>b.addEventListener("click", ()=>act2("quiz:"+b.dataset.quiz, undefined, b)));
  bindWord();
  if(!st.info && G.miss>=2) markTarget();
  const pop=$("#pop"); if(pop.textContent){ pop.classList.add("anim"); }
}

    invoegen:[["Voorblad","#9DC3E6"],["Lege pagina","#fff"],["Pagina-einde","#ddd"],["Tabel","#5B9BD5"],["Afbeeldingen","#70AD47"],["Vormen","#ED7D31"],["SmartArt","#A5A5A5"],["Grafiek","#FFC000"],["Koptekst","#9DC3E6"],["Voettekst","#9DC3E6"],["Paginanummer","#2B579A"],["Tekstvak","#fff"],["Symbool","#7030A0"]],

let kwTimer=null, wbScroll=0, ribScroll=0, lastAct={k:"",t:0};
function bindWord(){
  const w=$("#word"); if(!w) return;
  const wb=$("#wbody"); wb.scrollTop=wbScroll; wb.addEventListener("scroll",()=>{wbScroll=wb.scrollTop;});
  const rw=$("#ribwrap"); rw.scrollLeft=ribScroll; rw.addEventListener("scroll",()=>{ribScroll=rw.scrollLeft; placeMenu();});
  placeMenu();
  w.addEventListener("input", e=>{ const el=e.target; if(el.list && e.inputType==="insertReplacementText") act2(el.dataset.act, el.value, el); });
  w.addEventListener("click", e=>{
    if(e.shiftKey){ const pe=e.target.closest(".p[data-pid]"); if(pe && w.contains(pe)){ act2("shift:"+pe.dataset.pid, undefined, pe); return; } }
    const el=e.target.closest("[data-act]"); if(!el || !w.contains(el)) return;
    if(el.tagName==="INPUT"||el.tagName==="SELECT") return;
    const act=el.dataset.act;
    if(act==="kwast"){ // enkel of dubbel klikken
      if(kwTimer){ clearTimeout(kwTimer); kwTimer=null; act2("kwast2", undefined, el); }
      else kwTimer=setTimeout(()=>{ kwTimer=null; act2("kwast1", undefined, el); }, 320);
      return;
    }
    act2(act, el.dataset.val, el);
  });
  w.addEventListener("contextmenu", e=>{
    const sg=e.target.closest('[data-act^="style:"]');
    if(sg){ e.preventDefault(); const wb0=w.getBoundingClientRect(); G.ui._ctxNext={x:Math.min(e.clientX-wb0.left, wb0.width-300), y:e.clientY-wb0.top};
      act2("stylectx:"+sg.dataset.act.slice(6), undefined, sg, true); return; }
    const el=e.target.closest(".p[data-act]"); if(!el) return;
    e.preventDefault();
    const wb=w.getBoundingClientRect(); G.ui._ctxNext={x:Math.min(e.clientX-wb.left, wb.width-240), y:e.clientY-wb.top};
    act2(el.dataset.act.replace("sel:","ctx:"), undefined, el, true);
  });
  w.addEventListener("change", e=>{ const el=e.target; if(el.dataset && el.dataset.act) act2(el.dataset.act, el.value, el); });
  w.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.tagName==="INPUT"){ e.preventDefault(); e.target.blur(); } });
}
function placeMenu(){
  const m=document.querySelector("#word .menu"); if(!m) return;
  if(m.dataset.ctx){ const W=$("#word"); const top=parseFloat(m.style.top), maxTop=W.clientHeight-m.offsetHeight-6;
    if(top>maxTop) m.style.top=Math.max(4,maxTop)+"px"; return; }
  const o=document.querySelector(`#word [data-act="${m.dataset.for}"]`), w=$("#word"); if(!o) return;
  const ob=o.getBoundingClientRect(), wb=w.getBoundingClientRect();
  m.style.top=(ob.bottom-wb.top+2)+"px";
  m.style.left=Math.max(4, Math.min(ob.left-wb.left, wb.width-m.offsetWidth-4))+"px";
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && S.screen==="play" && G && !step().info){ e.preventDefault(); act2("esc"); } });

function numOf(x){ const m=String(x).replace(",",".").match(/-?\d+(\.\d+)?/); return m? parseFloat(m[0]) : NaN; }
function same(a, want){
  if(want===undefined) return true;
  const na=numOf(a), nw=numOf(want);
  if(!isNaN(nw) && /^[\d.,\s]*(cm|pt)?\s*$/i.test(String(want))) return Math.abs(na-nw)<1e-6;
  return String(a).trim().toLowerCase()===String(want).trim().toLowerCase();
}
function nameOf(act, val, el){
  if(act==="esc") return "de toets Esc";
  if(act==="kwast1") return "Opmaak kopiëren (één klik)";
  if(act==="kwast2") return "Opmaak kopiëren (dubbelklik)";
  if(act.startsWith("shift:")) return "Shift + klik op " + (el && el.dataset.name || "tekst");
  if(el && el.tagName==="SELECT") return el.dataset.name + ` (je koos '${el.options[el.selectedIndex]? el.options[el.selectedIndex].text : val}')`;
  if(el && el.dataset.name) return el.dataset.name + (el.tagName==="INPUT"? ` (je koos '${val}')` : "");
  return act;
}

function act2(act, val, el, right){
  if(!G || S.screen!=="play") return;
  const st=step(); if(st.info) return;
  const key=act+"|"+val, now=Date.now(); if(lastAct.k===key && now-lastAct.t<600) return; lastAct={k:key,t:now};
  if(st.a==="esc" && (act==="kwast1"||act==="kwast2") && G.ui.kwast) act="esc";
  if(act===st.a && same(val, st.v)){
    apply(act, val);
    const pts = G.miss===0?10: G.miss===1?6:3;
    G.score+=pts; G.pop="+"+pts; G.msg={k:"good", h: ["Juist!","Goed zo!","Top!","Helemaal juist!","Knap!"][G.i%5] + (G.miss?"":" Van de eerste keer.")};
    advance();
  } else {
    G.miss++; G.errors++;
    const wrongName = nameOf(act,val,el);
    const what = st.quiz? `Dat klopt niet.` : (st.a.startsWith("shift:") && act.startsWith("sel:"))? `Je klikte zonder Shift. Hou de <b>Shift</b>-toets ingedrukt terwijl je klikt.` : ((st.a.startsWith("ctx:") && act.startsWith("sel:")) || (st.a.startsWith("stylectx:") && act.startsWith("style:")))? `Dat was een gewone klik met de <b>linkermuisknop</b>. Gebruik de <b>rechtermuisknop</b>.` : (right && !/^(ctx|stylectx):/.test(st.a))? `Dat was een klik met de <b>rechtermuisknop</b>. Hier heb je de gewone (linker)muisknop nodig.` : (st.a===act && st.v!==undefined)? `Dat is niet de juiste waarde. Typ of kies <b>${esc(st.vl || String(st.v).replace(".",","))}</b>.` : `Dat was <b>${esc(wrongName)}</b>. Je zoekt iets anders.`;
    G.msg = {k: G.miss>=1? "hint":"bad", h: `${what}<br><b>Tip:</b> ${esc(st.h)}${G.miss>=2?" <b>Kijk: de juiste plaats knippert.</b>":""}`};
    renderPlay();
  }
}
function selList(key){ const k=key||G.ui.sel, P=G.doc.paras; if(!k) return [];
  if(k.startsWith("range:")){ let [i,j]=k.slice(6).split("~").map(id=>P.findIndex(p=>p.id===id)); if(i>j) [i,j]=[j,i]; return P.slice(i,j+1); }
  if(k.startsWith("sim:")){ const r=P.find(p=>p.id===k.slice(4)); return P.filter(p=>p.kind===r.kind && p.st===r.st && p.s.color===r.s.color); }
  return P.filter(p=>p.id===k||(p.grp&&p.grp===k)); }
function selP(){ return selList()[0]; }
function apply(act, val){
  const all=selList(), before = all[0]? {...all[0].s} : null;
  apply1(act, val);
  const now=selList();
  if(before && now[0] && now.length>1 && now[0]===all[0]){
    const diff={}; for(const k in now[0].s) if(now[0].s[k]!==before[k]) diff[k]=now[0].s[k];
    now.slice(1).forEach(x=>Object.assign(x.s, diff));
  }
}
function apply1(act, val){
  const ui=G.ui, p=selP(), s=p&&p.s;
  const [k, sub] = act.split(":");
  if(k==="tab"){ ui.tab=sub; ui.menu=null; return; }
  if(k==="style"){ selList().forEach(x=>{ x.st=sub; for(const kk of Object.keys(x.ov)) delete x.ov[kk]; }); return; }
  if(k==="stylectx"){ ui.menu="stylectx"; ui.ctxPos=ui._ctxNext; ui.styleKey=sub; return; }
  if(act==="stijl:wijzigen"){ ui.menu=null; ui.dialog="stijl"; ui.dlgStyle=ui.styleKey; ui.dlg=resolvedStyle(G.doc, ui.styleKey); ui.sub=null; ui.swMenu=false; return; }
  if(k==="sw"){ const d=ui.dlg; const rest=act.split(":").slice(2).join(":");
    if(sub==="ok"){ const key=ui.dlgStyle, base= key==="standaard"? {...BASE} : resolvedStyle(G.doc,"standaard"), out={};
      for(const kk in d) if(d[kk]!==base[kk]) out[kk]=d[kk];
      G.doc.styles[key]=out; ui.dialog=null; ui.swMenu=false; return; }
    if(sub==="x"){ ui.dialog=null; ui.swMenu=false; return; }
    if(sub==="font"){ d.font=Object.keys(FONTS).find(f=>f.toLowerCase()===String(val).trim().toLowerCase())||val; return; }
    if(sub==="size"){ d.size=numOf(val); return; }
    if(sub==="bold"||sub==="italic"||sub==="underline"){ d[sub]=!d[sub]; return; }
    if(sub==="color"){ d.color=SWCOLORS[val]||d.color; return; }
    if(sub==="align"){ d.align=rest; return; }
    if(sub==="opmaak"){ ui.swMenu=!ui.swMenu; return; }
    if(sub==="alinea"){ ui.swMenu=false; ui.sub="alinea"; ui.dlg2={...d}; return; }
    return; }
  if(k==="ctx"){
    if(sub==="lijst"){ ui.menu=null; ui.dialog="lijst"; ui.dlg={lpos:s.lpos, lind:s.lind}; return; }
    ui.sel=sub; ui.menu="ctx"; ui.ctxPos=ui._ctxNext; return; }
  if(k==="li"){ const d=ui.dlg;
    if(sub==="ok"){ Object.assign(s, {lpos:d.lpos, lind:d.lind}); ui.dialog=null; return; }
    if(sub==="x"){ ui.dialog=null; return; }
    d[sub==="pos"?"lpos":"lind"]=numOf(val); return; }
  if(act==="bullet"){ s.list= val==="geen"? null : "bullet"; s.bullet=val; ui.menu=null; return; }
  if(act==="num"){ s.list= val==="geen"? null : "number"; s.numfmt=val; ui.menu=null; return; }
  if(k==="sel"){ const tgts=selList(sub);
    if(ui.kwast && ui.copy){ tgts.forEach(t=>Object.assign(t.s, ui.copy)); if(ui.kwast===1){ ui.kwast=0; ui.copy=null; } }
    ui.sel=sub; return; }
  if(act==="kwast1"||act==="kwast2"){ if(ui.kwast){ ui.kwast=0; ui.copy=null; return; } ui.kwast=act==="kwast1"?1:2; ui.copy= s? {...s}:null; return; }
  if(act==="esc"){ ui.kwast=0; ui.copy=null; ui.menu=null; return; }
  if(k==="shift"){ ui.sel="range:"+(p? p.id : sub)+"~"+sub; return; }
  if(act==="selsim"){ ui.menu=null; if(p) ui.sel="sim:"+p.id; return; }
  if(act==="ml"){ ui.menu=null; G.doc.ml={levels:mlLevels(val)}; if(!G.doc.ml.levels[0].link && s) s.list="multi"; return; }
  if(act==="ml:dlg"){ ui.menu=null; ui.dialog="mld"; ui.dlg={lvl:1, levels:(G.doc.ml? G.doc.ml.levels : mlLevels("abc")).map(x=>({...x}))}; return; }
  if(k==="mld"){ const d=ui.dlg, L=d.levels[d.lvl-1];
    if(sub==="ok"){ G.doc.ml={levels:d.levels}; ui.dialog=null; return; }
    if(sub==="x"){ ui.dialog=null; return; }
    if(sub==="lvl"){ d.lvl=+act.split(":")[2]; return; }
    if(sub==="fmt"){ L.fmt=val; return; } if(sub==="link"){ L.link=val; return; }
    if(sub==="pos"||sub==="ind"){ L[sub]=numOf(val); return; } return; }
  if(act==="toc"){ ui.menu=null; if(val!=="hand") G.doc.toc={at:p? p.id : G.doc.paras[0].id, entries:tocEntries()}; return; }
  if(k==="tocu"){ if(sub==="ok"){ if(ui.dlg.mode==="alles") G.doc.toc.entries=tocEntries(); ui.dialog=null; return; } if(sub==="x"){ ui.dialog=null; return; } ui.dlg.mode=sub; return; }
  if(k==="menu"){ ui.menu=sub; return; }
  if(k==="btn"){
    if(sub==="pilcrow"){ ui.marks=!ui.marks; return; }
    if(sub==="opsomming" && s){ s.list = s.list==="bullet"? null : "bullet"; if(s.list && !BGLYPH[s.bullet]) s.bullet="rond"; return; }
    if(sub==="nummering" && s){ s.list = s.list==="number"? null : "number"; if(s.list && s.numfmt==="geen") s.numfmt="1."; return; }
    if(sub==="marges"){ ui.menu="marges"; return; }
    if(sub==="tocupdate"){ if(G.doc.toc){ ui.dialog="tocu"; ui.dlg={mode:"pag"}; } return; }
    if((sub==="inspringen-plus"||sub==="inspringen-min") && s && s.list==="multi"){ s.lvl=Math.max(1, Math.min(9, (s.lvl||1)+(sub==="inspringen-plus"?1:-1))); return; }

    if({links:1,centreren:1,rechts:1,uitvullen:1}[sub]) s.align={links:"left",centreren:"center",rechts:"right",uitvullen:"justify"}[sub];
    return;
  }
  if(act==="fontname"){ s.font=Object.keys(FONTS).find(f=>f.toLowerCase()===String(val).trim().toLowerCase())||val; return; }
  if(act==="fontsize"){ s.size=numOf(val); return; }
  if(act==="color"){ s.color=COLORS[val]||s.color; s.effect=0; ui.menu=null; return; }
  if(act==="effect"){ s.effect=(+val)+1; ui.menu=null; return; }
  if(k==="rand"){ if(s) s.border=sub==="onder"?"onder":""; ui.menu=null; return; }
  if(k==="marge"){
    ui.menu=null;
    const presets={normaal:2.5,smal:1.27,gemiddeld:2.54,breed:2.54};
    if(sub==="aangepast"){ ui.dialog="pagina"; ui.dlg={...G.doc.margins}; return; }
    if(sub==="breed"){ G.doc.margins={boven:2.54,onder:2.54,links:5.08,rechts:5.08}; return; }
    if(sub==="gemiddeld"){ G.doc.margins={boven:2.54,onder:2.54,links:1.91,rechts:1.91}; return; }
    const v=presets[sub]||2.5; G.doc.margins={boven:v,onder:v,links:v,rechts:v}; return;
  }

  if(act==="launch:alinea"){ ui.dialog="alinea"; ui.dlg={...s}; return; }
  if(k==="al"){
    const d= ui.sub==="alinea"? ui.dlg2 : ui.dlg;
    if(sub==="ok"){ if(ui.sub==="alinea"){ Object.assign(ui.dlg, d); ui.sub=null; return; } Object.assign(s, d); ui.dialog=null; return; }
    if(sub==="x"){ if(ui.sub==="alinea"){ ui.sub=null; return; } ui.dialog=null; return; }
    if(sub==="special"){ d.special= val==="(geen)"?"geen":val; return; }
    if(sub==="line"){ d.line=val; if(val==="Exact"||val==="Ten minste") d.at=d.at>3?d.at:12; if(val==="Meerdere") d.at=1.08; return; }
    if(sub==="align"){ d.align={Links:"left",Gecentreerd:"center",Rechts:"right",Uitgevuld:"justify"}[val]; return; }
    d[sub]=numOf(val); return;
  }
}

function markTarget(){
  const st=step(); let el=document.querySelector(`#word [data-act="${CSS.escape(st.a)}"]`);
  if(st.quiz) el=document.querySelector(`[data-quiz="${st.a.slice(5)}"]`);

  if(st.a==="kwast1"||st.a==="kwast2"||st.a==="esc") el=document.querySelector('#word [data-act="kwast"]');
  if(st.a.startsWith("ctx:") && st.a!=="ctx:lijst") el=document.querySelector(`#word [data-act="sel:${st.a.slice(4)}"]`);
  if(st.a==="bullet"||st.a==="num") el=document.querySelector(`#word [data-act="${st.a}"][data-val="${CSS.escape(String(st.v))}"]`);
  if(st.a==="ml"||st.a==="toc") el=document.querySelector(`#word [data-act="${st.a}"][data-val="${CSS.escape(String(st.v))}"]`);
  if(st.a.startsWith("shift:")) el=document.querySelector(`#word [data-pid="${st.a.slice(6)}"]`);
  if(st.a==="color"||st.a==="effect") el=document.querySelector(`#word [data-act="${st.a}"][data-val="${CSS.escape(String(st.v))}"]`);
  if(el){ el.classList.add("target"); el.scrollIntoView({block:"nearest",inline:"nearest"}); }
}

/* ---------- einde level ---------- */
function finish(){
  const n=G.n, max=maxPts(G.L), stars=starsFor(G.score,max);
  const prev=S.prog.best[n];
  if(!prev || prev.fromCode || G.score>prev.score) S.prog.best[n]={score:G.score, stars, errors:G.errors};
  S.prog.unlocked=Math.max(S.prog.unlocked, Math.min(LEVELS.length, n+1));
  save(); G.result={stars, max}; S.screen="end"; render(); window.scrollTo({top:0});
}
function renderEnd(){
  const n=G.n, code=makeCode(S.name, done(), total()), nxt=nextOf(n), last=!nxt;
  app.innerHTML = header() + `<div class="card done">
    <span class="muted" style="text-transform:uppercase;letter-spacing:.08em;font-weight:700">${lvLabel(n)} afgewerkt</span>
    <h2 style="font-size:2rem">${esc(G.L.name)}</h2>
    ${starHTML(G.result.stars,"bigstars")}
    <div class="stats"><div><span class="muted">Punten</span><b>${G.score} / ${G.result.max}</b></div><div><span class="muted">Foutjes</span><b>${G.errors}</b></div><div><span class="muted">Totaal</span><b>${total()}</b></div></div>
    <div><div class="muted" style="margin-bottom:6px">Jouw code (lever die in op Teams, en bewaar hem om volgende keer verder te spelen):</div>
      <div class="codebox"><span class="code" id="code">${code}</span><button class="btn ghost small" id="copy">Kopieer code</button></div></div>
    <p class="muted" style="margin:0">${G.result.stars<3?"Wil je meer sterren? Speel het level gerust opnieuw.":"Drie sterren! Je kent dit nu."} ${last?"Je hebt alle levels gedaan. Probeer het nu in het echte Word!":"Probeer straks hetzelfde ook eens in het echte Word."}</p>
    ${SEND.url?`<div class="codebox"><a class="btn" id="send" href="${esc(sendURL(n))}" target="_blank" rel="noopener">Verzenden naar de leerkracht</a><span class="muted" id="sendmsg">Er opent een formulier dat al ingevuld is. Klik daar onderaan op <b>Verzenden</b>.</span></div>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap">${!last?`<button class="btn${SEND.url?" ghost":""}" id="nxt">Volgend level</button>`:""}<button class="btn ghost" id="again">Opnieuw spelen</button><button class="btn ghost" data-go="map">Naar de levels</button></div></div>` + footer();
  $("#copy").addEventListener("click", ()=>{ const t=$("#code").textContent;
    try{ navigator.clipboard.writeText(t).then(()=>{$("#copy").textContent="Gekopieerd";}, sel); }catch(e){ sel(); }
    function sel(){ const r=document.createRange(); r.selectNodeContents($("#code")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); $("#copy").textContent="Druk op Ctrl+C"; } });
  if(!last) $("#nxt").addEventListener("click", ()=>startLevel(nxt));
  if(SEND.url) $("#send").addEventListener("click", ()=>{ $("#send").textContent="Formulier geopend ✓"; $("#sendmsg").innerHTML="Vergeet niet in het formulier op <b>Verzenden</b> te klikken. Daarna mag je dat tabblad sluiten."; });
  $("#again").addEventListener("click", ()=>startLevel(n));
}
function renderTeacher(){
  app.innerHTML = header() + `<div class="card teacher"><h2 style="font-size:1.6rem">Code controleren</h2>
    <p class="muted" style="margin:0">Typ de naam precies zoals de leerling hem invulde en de code die je kreeg. Je ziet dan tot welk level de leerling kwam en hoeveel punten hij of zij had. Een code past maar bij één naam, dus overnemen van een klasgenoot lukt niet.</p>
    <form id="f-t" novalidate style="display:grid;gap:10px">
    <label class="f" for="t-name">Naam leerling<input class="txt" id="t-name" autocomplete="off"></label>
    <label class="f" for="t-code">Code<input class="txt" id="t-code" autocomplete="off" placeholder="bv. 3-240-K7QZ"></label>
    <button class="btn" type="submit">Controleer</button><div id="t-res"></div></form>
    <details><summary>Wat betekent de code?</summary><p class="muted">Eerste deel: welke levels afgewerkt zijn (de controle hierboven zet dat voor je om). Tweede getal: het totaal aantal punten over alle levels. Per stap zijn er 10 punten te verdienen: 10 bij een juiste eerste klik, 6 na één fout, 3 na meer fouten. De levels (nummer in de code → level in het spel): ${LEVELS.map((L,i)=>`${i+1} = ${lvLabel(i+1)} ${esc(L.name)} (${maxPts(L)} ptn)`).join(" · ")}.</p></details>
    <div><button class="btn ghost small" data-go="${S.name?"map":"start"}">Terug</button></div></div>` + footer();
  $("#f-t").addEventListener("submit", e=>{ e.preventDefault();
    const r=readCode($("#t-name").value, $("#t-code").value), out=$("#t-res");
    if(r){ out.className="result"; out.style.background="var(--good-bg)"; out.style.color="var(--good)";
      out.innerHTML=`Geldig. ${r.score} punten in totaal. Afgewerkt: `+CHAPTERS.filter(c=>c.levels.length).map(c=>{ const d=c.levels.filter(n=>r.levels.includes(n)); return `<br><b>${esc(c.name)}</b>: ${d.length} van ${c.levels.length}${d.length && d.length<c.levels.length? " ("+d.map(n=>lvLabel(n)).join(", ")+")":""}`; }).join(""); }
    else { out.className="result"; out.style.background="var(--bad-bg)"; out.style.color="var(--bad)"; out.textContent="Deze code past niet bij deze naam. Kijk de schrijfwijze van de naam na."; }
  });
}
app.addEventListener("click", e=>{ const g=e.target.closest("[data-go]"); if(!g) return; S.screen=g.dataset.go; G=null; render(); });

render();
})();
</script>

</body></html>
