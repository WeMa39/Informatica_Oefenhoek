<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escaperoom: Ontsnap uit de groepschat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14121f; --panel:#1f1c30; --panel2:#2a2640; --line:#3a3556;
  --text:#f3f1ff; --muted:#b4aed3; --accent:#8b7bff; --accent2:#2fd3b5;
  --good:#3ddc84; --bad:#ff6b7a; --warn:#ffc65c;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#2b2160 0%,transparent 60%),var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;font-size:18px;line-height:1.5;min-height:100vh}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;margin:0 0 .4em}
.wrap{max-width:980px;margin:0 auto;padding:20px 18px 60px}
.topbar{position:sticky;top:0;z-index:5;background:rgba(20,18,31,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .inner{max-width:980px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:Fredoka;font-weight:700;font-size:20px;flex:1;min-width:200px}
.locks{display:flex;gap:6px}
.lock{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:16px}
.lock.open{background:rgba(61,220,132,.18);border-color:var(--good)}
.lock.cur{border-color:var(--accent);box-shadow:0 0 0 2px rgba(139,123,255,.35)}
.timer{font-family:Fredoka;font-size:24px;font-weight:600;padding:4px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);min-width:100px;text-align:center}
.timer.low{color:var(--warn)} .timer.over{color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;margin-top:20px}
.muted{color:var(--muted)}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:12px 22px;cursor:pointer;background:var(--accent);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:700}
.btn.small{padding:8px 14px;font-size:15px}
input[type=text]{font:inherit;font-weight:700;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 14px;outline:none}
input[type=text]:focus{border-color:var(--accent)}
.codebox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px;padding:16px;border-radius:16px;background:var(--panel2);border:1px dashed var(--accent)}
.codebox input{letter-spacing:4px;text-transform:uppercase;width:220px;font-size:22px}
.msg{min-height:1.5em;font-weight:700;margin-top:8px}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sit{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;position:relative}
.sit .lt{position:absolute;top:-10px;right:12px;background:var(--accent);color:#fff;font-family:Fredoka;font-weight:700;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px}
.sit .num{font-weight:800;color:var(--accent2);font-size:15px}
.toggle{display:flex;gap:6px;margin-top:10px}
.toggle button{flex:1;font:inherit;font-size:14px;font-weight:800;padding:7px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.toggle button.on.p{background:rgba(255,107,122,.2);color:var(--bad);border-color:var(--bad)}
.toggle button.on.n{background:rgba(61,220,132,.15);color:var(--good);border-color:var(--good)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.match{grid-template-columns:1fr}}
.form-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.form-row b{font-family:Fredoka;color:var(--accent2);margin-right:6px}
select{font:inherit;font-weight:800;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.ex{padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.ex .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);font-weight:800;margin-right:8px}
/* chat */
.phone{max-width:520px;margin:0 auto;background:#0f0d18;border:1px solid var(--line);border-radius:26px;overflow:hidden}
.phone .head{padding:12px 16px;background:#221e36;display:flex;align-items:center;gap:10px;font-weight:800}
.phone .head .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
.chat{padding:14px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.bub{max-width:82%;padding:8px 12px;border-radius:16px;font-size:16px;background:#2a2640;align-self:flex-start}
.bub .who{font-size:12px;font-weight:800;color:var(--accent2)}
.bub.me{align-self:flex-end;background:var(--accent)}
.bub.sys{align-self:center;background:transparent;color:var(--muted);font-size:14px;font-style:italic;text-align:center}
.opts{display:flex;flex-direction:column;gap:8px;padding:12px 14px 16px;border-top:1px solid var(--line)}
.opt{font:inherit;font-size:16px;text-align:left;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.wrong{border-color:var(--bad);opacity:.6}
.fb{padding:10px 14px;border-radius:12px;margin:0 14px 12px;font-size:16px}
.fb.bad{background:rgba(255,107,122,.12);border:1px solid var(--bad)}
.fb.good{background:rgba(61,220,132,.12);border:1px solid var(--good)}
.letters{display:flex;gap:8px;justify-content:center;margin:16px 0 0}
.letters span{width:46px;height:52px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-family:Fredoka;font-size:26px;font-weight:700}
.letters span.got{border-style:solid;border-color:var(--good);background:rgba(61,220,132,.12)}
/* waar/niet waar */
.st{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);margin-bottom:8px}
.st .dg{font-family:Fredoka;font-size:22px;font-weight:700;width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none;color:var(--warn)}
.st .tx{flex:1}
.st .toggle{margin:0;flex:none;width:200px}
@media(max-width:600px){.st{flex-wrap:wrap}.st .toggle{width:100%}}
/* kruiswoord */
.cw{display:flex;flex-direction:column;gap:10px}
.cwrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line)}
.cwrow .clue{flex:1;min-width:240px}
.cells{display:flex;gap:3px}
.cells input{width:30px;height:36px;padding:0;text-align:center;font-size:18px;text-transform:uppercase;border-radius:8px;border-width:2px}
.cells input.first{border-color:var(--warn)}
.cwrow.ok .cells input{border-color:var(--good);background:rgba(61,220,132,.12)}
.cwrow.ok .cells input.first{background:var(--good);color:#0f0d18}
.hint{margin-top:14px}
.hintbox{margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(255,198,92,.1);border:1px solid var(--warn);display:none}
.intro-ill{font-size:64px;text-align:center}
.big{font-size:22px}
.center{text-align:center}
.qr{display:inline-block;background:#fff;padding:12px;border-radius:16px;margin:12px 0}
.final-time{font-family:Fredoka;font-size:44px;color:var(--good)}
.slogan{font-family:Fredoka;font-size:28px;color:var(--accent2)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:800;color:var(--muted)}
.footer{margin-top:30px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.scene{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#9fd3ff}
.scene svg{display:block;width:100%;height:auto}
.hs{cursor:pointer}.hs .hit{fill:transparent}.hs:hover .hit{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:2;stroke-dasharray:6 4}
.scfb{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.scfb.good{border-color:var(--good);background:rgba(61,220,132,.1)}.scfb.bad{border-color:var(--warn);background:rgba(255,198,92,.08)}
.av2{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.roles{display:grid;gap:6px}.role{padding:8px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.role>b:first-child{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--accent);margin-right:4px}
.ig .post{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#ff6fb1,#8b7bff 55%,#2fd3b5);display:grid;place-items:center}
.ig .dancer{font-size:110px;animation:dans 1.2s ease-in-out infinite alternate}
@keyframes dans{from{transform:rotate(-12deg) translateY(4px)}to{transform:rotate(12deg) translateY(-6px)}}
.ig .play{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.5);padding:3px 10px;border-radius:99px;font-size:14px;font-weight:800}
.ig .cap{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:10px;font-size:15px;font-weight:700}
.comments{padding:4px 14px 14px}
.cm{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cm .ct{flex:1;font-size:16px}.cm .ct b{color:var(--accent2)}
.flag{font:inherit;font-weight:800;width:42px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;flex:none}
.flag.on{background:var(--good);color:#0f0d18;border-color:var(--good)}.flag.wrong{border-color:var(--warn)}
.cmfb{display:none;font-size:14px;color:var(--warn);padding:0 0 6px}.cmfb.show{display:block}
.warnbar{padding:10px 14px;border-radius:12px;background:rgba(255,107,122,.12);border:1px solid var(--bad);margin-bottom:12px;font-size:16px}
.bub.sx{cursor:pointer;border:2px solid transparent}.bub.sx:hover{border-color:var(--warn)}
.bub.sx.flagged{border-color:var(--bad);background:rgba(255,107,122,.18)}
.flagd{margin-top:4px;font-family:Fredoka;font-weight:700;color:var(--bad)}
.krant{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.clip{background:#f4f1ea;color:#1c1b19;border-radius:6px;padding:16px 16px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35);font-family:Georgia,"Times New Roman",serif;transform:rotate(-.4deg)}
.clip:nth-child(even){transform:rotate(.5deg)}
.clip .src{font-family:Nunito,sans-serif;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#a12b2b;border-bottom:2px solid #1c1b19;padding-bottom:6px;margin-bottom:8px}
.clip h4{font-size:20px;line-height:1.2;margin:0 0 8px;font-family:Georgia,serif}
.clip p{font-size:15.5px;line-height:1.45;margin:0 0 10px}
.clip a{font-family:Nunito,sans-serif;font-size:14px;font-weight:800;color:#a12b2b}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.qrow input{width:110px;text-align:center}
.qrow.ok input{border-color:var(--good);background:rgba(61,220,132,.12)}
.hidden{display:none!important}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
</style>
</head>

    ];

    el.innerHTML = `
      <p>Bijna vrij! Vul alle woorden in. De <span style="color:var(--warn);font-weight:800">eerste letters</span> vormen samen het wachtwoord van de groepschat, en meteen ook de belangrijkste boodschap van vandaag.</p>

    el.querySelectorAll(".cwrow").forEach(r=>{
      const i=r.dataset.i, ins=[...r.querySelectorAll("input")];

      ins.forEach((inp,k)=>{
        inp.addEventListener("input",()=>{inp.value=inp.value.slice(-1); if(inp.value&&ins[k+1]) ins[k+1].focus(); check();});

/* ---------- TIMER ---------- */
const timerEl = $("#timer");
function elapsedMs(){ if(!S.start) return 0; return (S.end||Date.now()) - S.start + S.penalty*60000; }
function fmt(ms){ const neg=ms<0; ms=Math.abs(ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return (neg?"+":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function tick(){
  const left = DUUR_MIN*60000 - elapsedMs();
  timerEl.textContent = S.start ? (left>=0 ? fmt(left) : fmt(-left).replace(/^/,"+")) : fmt(DUUR_MIN*60000);
  timerEl.className = "timer" + (left<0?" over": left<5*60000?" low":"");
}
setInterval(tick,500);

function drawLocks(){
  $("#locks").innerHTML = P.map((p,i)=>`<div class="lock ${i<S.stage-1||S.stage>P.length?'open':''} ${i===S.stage-1?'cur':''}">${i<S.stage-1||S.stage>P.length?'🔓':'🔒'}</div>`).join("");
}

/* ---------- SCHERMEN ---------- */
function render(){
  drawLocks(); tick(); window.scrollTo(0,0);
  if(S.stage===0) return intro();
  if(S.stage>P.length) return finish();
  const idx=S.stage-1, p=P[idx];
  app.innerHTML = `
    <div class="card">
      <span class="pill">Groep: ${esc(S.group)}</span>
      <h2 style="margin-top:10px">${p.title}</h2>
      <div id="puz"></div>
      <div class="codebox">
        <span class="big">🔑 Code:</span>
        <input type="text" id="code" autocomplete="off" placeholder="…">
        <button class="btn" id="go">Open het slot</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="hint">
        <button class="btn ghost small" id="hb">💡 Hint (+${STRAF_HINT_MIN} min)</button>
        <div class="hintbox" id="hbox">${p.hint}</div>
      </div>
    </div>`;
  p.render($("#puz"));
  if(S.hints[idx]){ $("#hbox").style.display="block"; $("#hb").disabled=true; $("#hb").textContent="💡 Hint gebruikt"; }
  $("#hb").onclick=()=>{
    if(S.hints[idx]) return;
    S.hints[idx]=1; S.penalty+=STRAF_HINT_MIN; save();
    $("#hbox").style.display="block"; $("#hb").disabled=true; $("#hb").textContent="💡 Hint gebruikt"; tick();
  };
  const tryCode=()=>{
    const inp=$("#code"), msg=$("#msg");
    if(cyrb53(norm(inp.value))===p.hash){
      msg.className="msg good"; msg.textContent="🔓 Klik! Het slot gaat open…";
      setTimeout(()=>{S.stage++; if(S.stage>P.length) S.end=Date.now(); save(); render();},1100);
    } else {
      msg.className="msg bad"; msg.textContent="❌ Die code klopt niet. Controleer jullie antwoorden nog eens.";
      inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake");
    }
  };
  $("#go").onclick=tryCode;
  $("#code").addEventListener("keydown",e=>{if(e.key==="Enter")tryCode();});
}

function intro(){
  app.innerHTML = `

      <div class="intro-ill">📱🔒</div>
      <h1>Ontsnap uit de groepschat</h1>
      <p class="big" style="max-width:640px;margin:0 auto 10px">In de klasgroep van 3B loopt het helemaal uit de hand. <b>Lien</b> wordt al weken gepest, en de beheerder heeft de chat op slot gezet met <b>10 codes</b>.</p>
      <p class="muted" style="max-width:640px;margin:0 auto">Kraak alle sloten om uit de chat te ontsnappen en Lien te helpen. Jullie hebben <b>${DUUR_MIN} minuten</b>. Een hint kan, maar die kost ${STRAF_HINT_MIN} strafminuut.</p>

        <li>De snelste groep (tijd + strafminuten) wint.</li>
        <li>Op het einde volgt nog één korte opdracht die je <b>alleen en anoniem</b> invult.</li>
      </ul>
      <div class="codebox" style="border-style:solid">
        <div style="display:flex;flex-direction:column;gap:12px;width:100%">
          <label style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="big" style="min-width:250px">👥 Naam van jullie groep:</span>
          <input type="text" id="gname" placeholder="bv. De Codekrakers" style="letter-spacing:0;text-transform:none;width:260px"></label>
          <label style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="big" style="min-width:250px">🔐 Startcode van je leerkracht:</span>
          <input type="text" id="scode" autocomplete="off" placeholder="…" style="width:260px;font-size:18px"></label>
          <div><button class="btn" id="start">Start de klok ⏱️</button></div>
        </div>
      </div>
      <div class="msg bad" id="msg"></div>
    </div>`;
  $("#start").onclick=()=>{
    const g=$("#gname").value.trim();
    if(!g){ $("#msg").textContent="Geef eerst een groepsnaam in."; return; }
    if(cyrb53(norm($("#scode").value))!==STARTCODE_HASH){ $("#msg").textContent="Die startcode klopt niet. Je krijgt de code van je leerkracht."; const sc=$("#scode"); sc.classList.remove("shake"); void sc.offsetWidth; sc.classList.add("shake"); return; }
    S.group=g; S.start=Date.now(); S.stage=1; save(); render();
  };
}

function finish(){
  const total = elapsedMs();
  app.innerHTML = `
    <div class="card center">
      <div class="intro-ill">🎉🔓</div>
      <h1>Jullie zijn ontsnapt!</h1>
      <p class="muted">Groep <b>${esc(S.group)}</b> · ${S.penalty} strafminuten</p>
      <div class="final-time">${fmt(total)}</div>
      <p class="muted" style="margin-top:0">Toon dit scherm aan je leerkracht.</p>
      <p class="slogan" style="margin-top:18px">Pesten is niet oké.<br>Reageer. Ook online.</p>
    </div>
    <div class="card center">
      <h2>📮 De vragenbus</h2>
      <p class="big" style="max-width:640px;margin:0 auto 6px">Nu werk je <b>alleen</b>. Scan de QR-code met je eigen gsm.</p>
      <p class="muted" style="max-width:640px;margin:0 auto">De vragenbus is <b>anoniem</b>: niemand ziet wie wat schreef. Wat bleef er hangen van de voordracht? Heb je nog een vraag? Of wil je iets kwijt over wat jij meemaakt of ziet gebeuren? Dat kan hier.</p>
      ${FORMS_URL ? `<div class="qr" id="qr">${QR_SVG}</div><p><a href="${FORMS_URL}" target="_blank" rel="noopener" style="color:var(--accent2);font-weight:800">Of klik hier om de vragenbus te openen</a></p>`
                  : `<div class="card" style="border-style:dashed;max-width:520px;margin:16px auto 0">Je leerkracht toont de link naar de vragenbus.</div>`}
      <p class="muted" style="font-size:15px;margin-top:14px">Zit je ergens mee? Je kan ook altijd terecht bij de leerlingbegeleiding, een leerkracht die je vertrouwt, of anoniem bij <b>Awel</b> (bel 102 of chat via awel.be). Gaat het over naaktbeelden of afpersing? Bel <b>Child Focus</b> op 116 000 (gratis, dag en nacht). Heb je donkere gedachten? Praat erover met de <b>Zelfmoordlijn</b>: 1813.</p>
    </div>
    <div class="footer"><span></span><button class="btn ghost small" id="reset">↺ Opnieuw beginnen (nieuwe groep)</button></div>`;
  $("#reset").onclick=resetConfirm;
}

function resetConfirm(){
  const b=$("#reset");
  if(b.dataset.c){ try{localStorage.removeItem(STORE);}catch(e){} S={stage:0,group:"",start:null,end:null,penalty:0,hints:{},p3:0,p4:{},p1:{}}; render(); }
  else { b.dataset.c=1; b.textContent="Zeker? Klik nog eens om alles te wissen"; }
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

if(/github\.io$/.test(location.hostname)) $("#back").classList.remove("hidden");
render();
</script>
